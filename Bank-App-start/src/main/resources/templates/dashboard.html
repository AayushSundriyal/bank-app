<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>VaultBank - Dashboard</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            min-height: 100vh;
            color: #333333;
        }

        /* Navbar */

        .navbar-custom {
            background-color: #17365d;
            padding: 14px 30px;
        }

        .navbar-custom .navbar-brand {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .navbar-custom .nav-link {
            color: white !important;
            margin-left: 20px;
            font-weight: 500;
        }

        .navbar-custom .nav-link:hover {
            color: #d9e6f2 !important;
        }


        /* Main Dashboard */

        .dashboard-container {
            max-width: 1000px;
            margin: 60px auto;
        }


        /* Welcome */

        .welcome-section {
            text-align: center;
            margin-bottom: 35px;
        }

        .welcome-section h2 {
            color: #17365d;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .balance {
            color: #333333;
            font-size: 22px;
            font-weight: 500;
        }


        /* Account Details */

        .account-details {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
            margin-bottom: 35px;
        }

        .account-details h4 {
            color: #17365d;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .account-details p {
            margin-bottom: 10px;
        }


        /* Action Buttons */

        .action-button {
            width: 100%;
            padding: 13px;

            background-color: #17365d;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            font-weight: bold;
        }

        .action-button:hover {
            background-color: #102a48;
            color: white;
        }


        /* Forms */

        .form-container {
            background-color: white;

            padding: 20px;

            border-radius: 8px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
        }

        .form-container label {
            font-weight: 500;
            color: #333333;
        }

        .form-control {
            border: 1px solid #cccccc;
        }

        .form-control:focus {
            border-color: #17365d;
            box-shadow: 0 0 0 2px rgba(23, 54, 93, 0.15);
        }

        .submit-button {
            background-color: #17365d;
            color: white;

            border: none;
            border-radius: 5px;

            padding: 10px;
            font-weight: bold;
        }

        .submit-button:hover {
            background-color: #102a48;
        }


        /* Error */

        .error {
            color: #842029;

            background-color: #f8d7da;

            padding: 12px;

            border-radius: 6px;

            text-align: center;

            margin-top: 25px;
        }

    </style>

</head>


<body>


<!-- Navigation Bar -->

<nav class="navbar navbar-expand-lg navbar-custom">

    <div class="container-fluid">

        <a class="navbar-brand" href="/dashboard">
            VaultBank
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link" href="/dashboard">
                Dashboard
            </a>

            <a class="nav-link" href="/transactions">
                Transactions
            </a>

            <a class="nav-link" href="/logout">
                Logout
            </a>

        </div>

    </div>

</nav>



<!-- Dashboard -->

<div class="container dashboard-container">


    <!-- Welcome -->

    <div class="welcome-section">

        <h2 th:text="'Welcome, ' + ${account.username}">
            Welcome
        </h2>

        <div class="balance"
             th:text="'Current Balance: $' + ${account.balance}">

            Current Balance: $0.00

        </div>

    </div>



    <!-- Account Details -->

    <div class="account-details">

        <h4>
            Account Details
        </h4>

        <p>
            <strong>Account Number:</strong>

            <span th:text="${account.id}">
                1
            </span>
        </p>

        <p>
            <strong>Account Type:</strong>
            Savings
        </p>

    </div>



    <!-- Banking Actions -->

    <div class="row g-4">


        <!-- Deposit -->

        <div class="col-md-4">

            <button
                    class="action-button"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#depositForm">

                Deposit

            </button>


            <div
                    class="collapse mt-3"
                    id="depositForm">

                <form
                        method="post"
                        action="/deposit"
                        class="form-container">

                    <div class="mb-3">

                        <label class="form-label">
                            Amount
                        </label>

                        <input
                                type="number"
                                class="form-control"
                                name="amount"
                                step="0.01"
                                min="0"
                                required>

                    </div>

                    <button
                            type="submit"
                            class="submit-button w-100">

                        Deposit Money

                    </button>

                </form>

            </div>

        </div>



        <!-- Withdraw -->

        <div class="col-md-4">

            <button
                    class="action-button"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#withdrawForm">

                Withdraw

            </button>


            <div
                    class="collapse mt-3"
                    id="withdrawForm">

                <form
                        method="post"
                        action="/withdraw"
                        class="form-container">

                    <div class="mb-3">

                        <label class="form-label">
                            Amount
                        </label>

                        <input
                                type="number"
                                class="form-control"
                                name="amount"
                                step="0.01"
                                min="0"
                                required>

                    </div>

                    <button
                            type="submit"
                            class="submit-button w-100">

                        Withdraw Money

                    </button>

                </form>

            </div>

        </div>



        <!-- Transfer -->

        <div class="col-md-4">

            <button
                    class="action-button"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#transferForm">

                Transfer Money

            </button>


            <div
                    class="collapse mt-3"
                    id="transferForm">

                <form
                        method="post"
                        action="/transfer"
                        class="form-container">

                    <div class="mb-3">

                        <label class="form-label">
                            Recipient Username
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                name="toUsername"
                                placeholder="Enter username"
                                required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Amount
                        </label>

                        <input
                                type="number"
                                class="form-control"
                                name="amount"
                                step="0.01"
                                min="0"
                                required>

                    </div>


                    <button
                            type="submit"
                            class="submit-button w-100">

                        Transfer Money

                    </button>

                </form>

            </div>

        </div>

    </div>



    <!-- Error Message -->

    <p
            th:if="${error != null}"
            th:text="${error}"
            class="error">

    </p>


</div>



<!-- Bootstrap JavaScript -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
