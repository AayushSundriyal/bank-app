<!DOCTYPE html>
<html>

<head>

    <title>VaultBank - Register</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-box {
            width: 400px;
            background-color: #ffffff;

            padding: 40px;

            border-radius: 10px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .bank-name {
            text-align: center;
            color: #17365d;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .register-title {
            text-align: center;
            color: #555555;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-label {
            color: #333333;
            font-weight: 500;
        }

        .form-control {
            padding: 11px;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        .form-control:focus {
            border-color: #17365d;
            box-shadow: 0 0 0 2px rgba(23, 54, 93, 0.15);
        }

        .register-button {
            width: 100%;
            padding: 11px;

            background-color: #17365d;
            color: white;

            border: none;
            border-radius: 5px;

            font-weight: bold;
            font-size: 16px;

            cursor: pointer;
        }

        .register-button:hover {
            background-color: #102a48;
        }

        .login-link {
            color: #17365d;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .error {
            margin-top: 15px;
            padding: 10px;

            background-color: #f8d7da;
            color: #842029;

            border-radius: 5px;
            text-align: center;
            font-size: 14px;
        }

    </style>

</head>


<body>

<div class="register-box">

    <!-- Bank Name -->
    <div class="bank-name">
        VaultBank
    </div>

    <!-- Register Title -->
    <div class="register-title">
        Create Your Bank Account
    </div>


    <!-- Register Form -->
    <form method="post" action="/register">

        <!-- Username -->
        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required>

        </div>


        <!-- Password -->
        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create a password"
                    required>

        </div>


        <!-- Register Button -->
        <button
                type="submit"
                class="register-button">

            Create Account

        </button>

    </form>


    <!-- Login Link -->
    <p class="text-center mt-4">

        Already have an account?

        <a
                href="/login"
                class="login-link">

            Login here

        </a>

    </p>


    <!-- Registration Error -->
    <div
            th:if="${error}"
            class="error">

        <span th:text="${error}"></span>

    </div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
