<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>VaultBank - Transaction History</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            min-height: 100vh;
        }

        /* Navbar */

        .navbar {
            background-color: #17365d;
        }

        .navbar-brand {
            color: white !important;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-link {
            color: white !important;
            font-weight: 500;
            margin-left: 15px;
        }

        .nav-link:hover {
            color: #d9e6f2 !important;
        }


        /* Page */

        .page-container {
            width: 90%;
            max-width: 1100px;

            /* More space below navbar */
            margin: 80px auto;
        }

        .page-title {
            color: #17365d;
            font-weight: bold;
            text-align: center;

            /* Space between title and table */
            margin-bottom: 45px;
        }


        /* Table Container */

        .table-container {
            background-color: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
        }


        /* Table */

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            background-color: #17365d;
            color: white;

            text-align: center;

            padding: 15px;
        }

        .table tbody td {
            text-align: center;

            vertical-align: middle;

            padding: 15px;
        }

        .table tbody tr:hover {
            background-color: #f1f5f9;
        }


        /* Transaction Colors */

        .deposit {
            color: #198754;
            font-weight: bold;
        }

        .withdrawal {
            color: #dc3545;
            font-weight: bold;
        }


        /* Back Button */

        .back-button {
            display: inline-block;

            background-color: #17365d;
            color: white;

            border: none;

            padding: 10px 22px;

            border-radius: 5px;

            text-decoration: none;

            font-weight: bold;
        }

        .back-button:hover {
            background-color: #102a48;
            color: white;
        }


        /* Empty Transactions */

        .empty-message {
            text-align: center;

            color: #777777;

            padding: 20px;
        }

    </style>

</head>


<body>


<!-- Navigation -->

<nav class="navbar navbar-expand-lg">

    <div class="container-fluid">

        <a
                class="navbar-brand"
                href="/dashboard">

            VaultBank

        </a>


        <div>

            <a
                    class="nav-link d-inline-block"
                    href="/dashboard">

                Dashboard

            </a>

            <a
                    class="nav-link d-inline-block"
                    href="/transactions">

                Transactions

            </a>

            <a
                    class="nav-link d-inline-block"
                    href="/logout">

                Logout

            </a>

        </div>

    </div>

</nav>



<!-- Transaction History -->

<div class="page-container">


    <h1 class="page-title">

        Transaction History

    </h1>



    <div class="table-container">

        <div class="table-responsive">

            <table class="table table-hover">


                <!-- Table Header -->

                <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        Type
                    </th>

                    <th>
                        Amount
                    </th>

                    <th>
                        Date
                    </th>

                </tr>

                </thead>



                <tbody>


                <!-- Transaction Rows -->

                <tr
                        th:each="transaction : ${transactions}">


                    <!-- ID -->

                    <td
                            th:text="${transaction.id}">

                        1

                    </td>



                    <!-- Type -->

                    <td
                            th:text="${transaction.type}">

                        Deposit

                    </td>



                    <!-- Amount -->

                    <td>


                        <!-- Positive Transaction -->

                        <span
                                th:if="${transaction.type == 'Deposit'
                                || transaction.type.contains('Transfer In')
                                || transaction.type.contains('transfer In')}"
                                class="deposit">

                            +$

                        </span>



                        <!-- Negative Transaction -->

                        <span
                                th:unless="${transaction.type == 'Deposit'
                                || transaction.type.contains('Transfer In')
                                || transaction.type.contains('transfer In')}"
                                class="withdrawal">

                            -$

                        </span>



                        <!-- Actual Amount -->

                        <span
                                th:text="${transaction.amount}">

                            0.00

                        </span>


                    </td>



                    <!-- Date -->

                    <td
                            th:text="${#temporals.format(transaction.timestamp, 'dd MMM yyyy, hh:mm a')}">

                        27 Sep 2026, 09:42 PM

                    </td>


                </tr>



                <!-- No Transactions -->

                <tr
                        th:if="${#lists.isEmpty(transactions)}">

                    <td
                            colspan="4"
                            class="empty-message">

                        No transactions found.

                    </td>

                </tr>


                </tbody>

            </table>

        </div>

    </div>



    <!-- Back to Dashboard -->

    <div class="text-center mt-4">

        <a
                href="/dashboard"
                class="back-button">

            Back to Dashboard

        </a>

    </div>


</div>



<!-- Bootstrap JavaScript -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
